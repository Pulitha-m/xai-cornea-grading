name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which services changed so unrelated jobs are skipped.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ml-service: ${{ steps.filter.outputs.ml-service }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            ml-service:
              - 'ml-service/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'docker-compose.yml'
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'frontend/nginx.conf'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Spring Boot)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # application.yml forces sslmode=require; the CI database has no TLS,
      # so override the full URL instead of DB_HOST/DB_PORT/DB_NAME.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (React + Vite)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ml-service:
    name: ML service (FastAPI)
    needs: changes
    if: needs.changes.outputs.ml-service == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ml-service/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Smoke test API
        run: |
          uv run --frozen --with httpx python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)

          r = client.get("/health")
          assert r.status_code == 200, r.text
          assert r.json()["status"] == "healthy"

          r = client.post("/analyze", json={"imageUrl": "https://example.com/x.jpg", "caseId": "CI-1"})
          assert r.status_code == 200, r.text
          assert r.json()["caseId"] == "CI-1"
          print("ml-service smoke test passed")
          EOF

  docker:
    name: Docker images build
    needs: changes
    if: needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create .env for compose
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build all images
        run: docker compose build
