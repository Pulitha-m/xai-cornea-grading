[project]
name = "ml-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "numpy==2.4.6",
    "onnxruntime>=1.31.0",
    "opencv-python-headless==5.0.0.93",
    "pandas==3.0.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime==1.4.4",
    "scikit-image==0.25.2",
    "scikit-learn==1.9.1",
    "shap==0.51.0",
    "stardist==0.9.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["real_backbone: uses the exported ONNX grading backbone instead of the synthetic stub"]

[tool.uv]
# rapidocr_onnxruntime asks for the GUI build of OpenCV; the headless build above provides the same cv2
# without X11/libGL (python:3.11-slim), so the GUI build is never installed.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
