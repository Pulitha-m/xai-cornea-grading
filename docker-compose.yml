services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: corneal-ai-backend

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://host.docker.internal:8000}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped