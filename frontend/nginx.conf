server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API is served from the same origin as the SPA, so the HttpOnly refresh
    # cookie and the XSRF-TOKEN cookie belong to this origin (SameSite=Strict).
    location /api/ {
        # Image uploads: matches the backend's multipart max-request-size (nginx defaults to 1 MB).
        client_max_body_size 17m;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bulk case import: a large file can take longer than nginx's 60 s default. Without this the browser
    # got a 504 while the backend kept importing, and a retry then clashed with the running import.
    location = /api/cases/import {
        client_max_body_size 6m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Client-side routing (react-router): fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite build assets can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
