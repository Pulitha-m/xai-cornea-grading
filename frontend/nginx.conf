server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router): fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite build assets can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
